name: React JS CI

# Triggers the workflow on push or pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Run the tasks on a fresh Linux virtual machine
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your code from GitHub into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0' # Specify your preferred Node version
          cache: 'npm'       # Caches dependencies to speed up future runs

      # 3. Install dependencies cleanly (avoids version mismatch issues)
      - name: Install Dependencies
        run: npm ci

      # 4. Run tests (if applicable)
      - name: Run Tests
        run: npm test -- --watchAll=false # Prevents the test runner from hanging

      # 5. Build the React project for production
      - name: Build Project
        run: npm run build
